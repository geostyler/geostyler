name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: geostyler/workflows/.github/workflows/release.yml@v1.0.0
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    needs: release
    if: needs.release.outputs.tag_name != ''
    uses: geostyler/workflows/.github/workflows/notify-discord.yml@v1.0.0
    with:
      message: ${{ github.event.repository.name }} [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }}) has been released. 🚀
    secrets:
      discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
